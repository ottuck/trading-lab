# 포트폴리오 데모 (D3, project.md 11-1절). 운영과 DB·비밀값을 나눈 별도 구성이다.
# 예시 시세만 있고 토스·주문 키는 없다. 운영과 같은 이미지(quant-lab:latest)를 데모 모드로 띄운다.
#   demo.env : POSTGRES_PASSWORD, DATABASE_URL (데모 DB 전용, 운영 값과 다르게)
# 바깥 접속은 운영의 cloudflared가 demo.trading-lab.me → http://demo-api:8000 으로 잇는다
# (Access 없이 누구나 본다). 둘은 quant-lab-edge 네트워크만 함께 쓰고, 데모는 운영 DB에 닿지 않는다.
name: quant-lab-demo

x-app: &app
  image: quant-lab:latest
  env_file: ${SECRETS_DIR:-../.secrets}/demo.env
  environment:
    DEMO_MODE: "true"
  restart: unless-stopped

services:
  demo-db:
    image: postgres:17
    restart: unless-stopped
    env_file: ${SECRETS_DIR:-../.secrets}/demo.env
    environment:
      POSTGRES_USER: quant
      POSTGRES_DB: quant_lab_demo
      TZ: UTC
    volumes:
      - demo-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quant -d quant_lab_demo"]
      interval: 5s
      timeout: 3s
      retries: 20

  demo-migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      demo-db:
        condition: service_healthy

  # 예시 시세를 오늘까지 늘리고 예시 봇을 이어서 평가한다 (6시간마다, 처음엔 2년치라 몇 분 걸린다)
  demo-seeder:
    <<: *app
    command: ["sh", "-c", "while true; do python -m quant_lab.cli seed-demo; sleep 21600; done"]
    depends_on:
      demo-migrate:
        condition: service_completed_successfully

  demo-api:
    <<: *app
    networks: [default, edge]
    depends_on:
      demo-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  edge:
    name: quant-lab-edge
    external: true

volumes:
  demo-db-data:
