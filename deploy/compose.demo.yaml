# 포트폴리오 데모 (D3, project.md 11-1절). 운영과 비밀값을 나눈 별도 구성이다.
# 예시 시세만 있고 토스·주문 키는 없다. 운영과 같은 이미지를 데모 모드로 띄운다.
# DB는 운영 Postgres 컨테이너 안의 별도 데이터베이스(quant_lab_demo)를 쓴다. 전용 계정(quant_demo)은 운영 DB(quant_lab)에
# 접속 권한이 없다 (deploy.sh가 계정·DB를 만들고 권한을 정리한다). 그래서 운영이 먼저 떠 있어야 한다.
#   demo.env : DEMO_DB_PASSWORD, DATABASE_URL (postgresql+psycopg://quant_demo:<비밀번호>@shared-db:5432/quant_lab_demo)
# 바깥 접속은 운영의 cloudflared가 demo.trading-lab.me → http://demo-api:8000 으로 잇는다
# (Access 없이 누구나 본다). 데모는 quant-lab-edge(터널)와 quant-lab-dbnet(데모 DB) 네트워크만 쓰고 운영 api·worker에는 닿지 않는다.
name: quant-lab-demo

# 컨테이너 로그가 디스크를 끝없이 채우지 않게 10MB 파일 3개로 제한한다 (UR Check·모니터링과 같은 값, 2026-10-21 측정: 모든 컨테이너 로그 합계 30MB).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app: &app
  image: ${IMAGE:-ghcr.io/ottuck/trading-lab}:${TAG:-latest}
  env_file: ${SECRETS_DIR:-../.secrets}/demo.env
  environment:
    DEMO_MODE: "true"
  networks: [default, dbnet]
  restart: unless-stopped
  logging: *logging

services:
  demo-migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  # 예시 시세를 오늘까지 늘리고 예시 봇을 이어서 평가한다 (6시간마다, 처음엔 2년치라 몇 분 걸린다)
  demo-seeder:
    <<: *app
    command: ["sh", "-c", "while true; do python -m trading_lab.cli seed-demo; sleep 21600; done"]
    # 서버(2GB)를 운영과 나눠 쓴다. 측정(2026-10-14): 평소 약 20MiB, 최대 375MiB (처음 2년치 채울 때 포함)
    mem_limit: 512m
    depends_on:
      demo-migrate:
        condition: service_completed_successfully

  demo-api:
    <<: *app
    networks: [default, dbnet, edge]
    # 측정(2026-10-14): 평소 약 175MiB, 최대 286MiB. 넘으면 이 컨테이너만 재시작되고 운영에는 닿지 않는다
    mem_limit: 384m
    depends_on:
      demo-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  edge:
    name: quant-lab-edge
    external: true
  dbnet:
    name: quant-lab-dbnet
    external: true
