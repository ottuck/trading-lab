# 운영 구성 (project.md 6절). 서버에서: docker compose -f deploy/compose.prod.yaml up -d --build
# 비밀값은 저장소 안 .secrets/에 둔다 (.gitignore·.dockerignore로 제외, 경로는 이 파일 기준).
#   env      : POSTGRES_PASSWORD, DATABASE_URL (api·worker·migrate·db)
#   worker.env : TOSS_CLIENT_ID, TOSS_CLIENT_SECRET, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, HEARTBEAT_PING_URL (worker만)
#   env (선택) : CF_ACCESS_TEAM, CF_ACCESS_AUD — 도메인으로 온 요청의 Access 토큰을 api가 한 번 더 확인
#   cloudflared.env (선택) : TUNNEL_TOKEN — 있으면 deploy.sh가 tunnel 프로필을 켠다 (도메인 접속, N7)
#   demo.env (선택) : 있으면 deploy.sh가 포트폴리오 데모(compose.demo.yaml)도 띄운다 (D3)
name: quant-lab-prod

x-app: &app
  image: quant-lab:latest
  env_file: ../.secrets/env
  restart: unless-stopped

services:
  db:
    image: postgres:17
    restart: unless-stopped
    env_file: ../.secrets/env
    environment:
      POSTGRES_USER: quant
      POSTGRES_DB: quant_lab
      TZ: UTC
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quant -d quant_lab"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    <<: *app
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *app
    # 호스트의 localhost에만 연다. 외부 접근은 tailscale serve가 담당한다.
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    <<: *app
    command: ["python", "-m", "quant_lab.worker"]
    env_file:
      - ../.secrets/env
      - ../.secrets/worker.env
    environment:
      WORKER_MARKET_SOURCE: ${WORKER_MARKET_SOURCE:-toss}
    # SIGTERM 뒤 현재 평가를 마칠 시간을 준다.
    stop_grace_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully

  # 도메인 접속 (N7, project.md 6절): 서버에서 Cloudflare로 밖으로만 연결한다 (공개 포트 0개).
  # 대시보드의 Public Hostname은 http://api:8000 으로 둔다. 앞단의 Access가 본인 이메일만 들인다.
  cloudflared:
    image: cloudflare/cloudflared:2026.9.3
    command: ["tunnel", "--no-autoupdate", "run"]
    env_file: ../.secrets/cloudflared.env
    restart: unless-stopped
    profiles: ["tunnel"]
    # edge: 포트폴리오 데모(demo-api)와만 함께 쓰는 네트워크. 운영 DB·Worker는 여기에 없다.
    networks: [default, edge]
    depends_on:
      api:
        condition: service_healthy

networks:
  edge:
    name: quant-lab-edge

volumes:
  db-data:
