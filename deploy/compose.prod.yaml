# 운영 구성 (project.md 6절). 이미지는 CI가 GHCR에 올린 것을 받아 쓴다 (TAG=커밋 해시, 기본 latest).
#   받아서 띄우기: bash deploy/deploy.sh   (직접: docker compose -f deploy/compose.prod.yaml pull && docker compose -f deploy/compose.prod.yaml up -d)
# 비밀값은 저장소 안 .secrets/에 둔다 (.gitignore·.dockerignore로 제외, 경로는 이 파일 기준).
# 다른 곳에 꺼낸 코드로 띄울 때(deploy.sh·update.sh)는 SECRETS_DIR로 그 폴더를 알려 준다.
#   env      : POSTGRES_PASSWORD, DATABASE_URL (api·worker·migrate·db)
#   worker.env : TOSS_CLIENT_ID, TOSS_CLIENT_SECRET, TOSS_ACCOUNT_ENABLED, LIVE_TRADING, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, HEARTBEAT_PING_URL, ANTHROPIC_API_KEY (worker만)
#   env (선택) : CF_ACCESS_TEAM, CF_ACCESS_AUD — 도메인으로 온 요청의 Access 토큰을 api가 한 번 더 확인
#   cloudflared.env (선택) : TUNNEL_TOKEN — 있으면 deploy.sh가 tunnel 프로필을 켠다 (도메인 접속, N7)
#   demo.env (선택) : DEMO_DB_PASSWORD, DATABASE_URL(quant_demo 계정, shared-db 호스트) — 있으면 deploy.sh demo가 포트폴리오 데모(compose.demo.yaml)를 띄운다 (D3)
name: quant-lab-prod

# 컨테이너 로그가 디스크를 끝없이 채우지 않게 10MB 파일 3개로 제한한다 (UR Check·모니터링과 같은 값, 2026-10-21 측정: 모든 컨테이너 로그 합계 30MB).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app: &app
  image: ${IMAGE:-ghcr.io/ottuck/trading-lab}:${TAG:-latest}
  env_file: ${SECRETS_DIR:-../.secrets}/env
  restart: unless-stopped
  logging: *logging

services:
  db:
    image: postgres:17.11
    restart: unless-stopped
    env_file: ${SECRETS_DIR:-../.secrets}/env
    environment:
      POSTGRES_USER: quant
      POSTGRES_DB: quant_lab
      TZ: UTC
    # dbnet: 데모(demo-*)가 같은 Postgres의 quant_lab_demo DB에만 붙는 네트워크. 데모 계정은 quant_lab에 접속 권한이 없다.
    networks:
      default:
      dbnet:
        aliases: [shared-db]
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quant -d quant_lab"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

  migrate:
    <<: *app
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *app
    # 호스트 localhost는 Tailscale 예비 경로다. 운영 도메인은 cloudflared → api:8000으로 연결한다.
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    <<: *app
    command: ["python", "-m", "trading_lab.worker"]
    env_file:
      - ${SECRETS_DIR:-../.secrets}/env
      - ${SECRETS_DIR:-../.secrets}/worker.env
    environment:
      WORKER_MARKET_SOURCE: ${WORKER_MARKET_SOURCE:-toss}
    # SIGTERM 뒤 현재 평가를 마칠 시간을 준다.
    stop_grace_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully

  # 도메인 접속 (N7, project.md 6절): 서버에서 Cloudflare로 밖으로만 연결한다 (공개 포트 0개).
  # 대시보드의 Public Hostname은 http://api:8000 으로 둔다. 앞단의 Access가 본인 이메일만 들인다.
  cloudflared:
    image: cloudflare/cloudflared:2026.10.5
    command: ["tunnel", "--no-autoupdate", "run"]
    env_file: ${SECRETS_DIR:-../.secrets}/cloudflared.env
    restart: unless-stopped
    profiles: ["tunnel"]
    logging: *logging
    # edge: 포트폴리오 데모(demo-api)와만 함께 쓰는 네트워크. 운영 DB·Worker는 여기에 없다.
    networks: [default, edge]
    depends_on:
      api:
        condition: service_healthy

networks:
  edge:
    name: quant-lab-edge
  dbnet:
    name: quant-lab-dbnet

volumes:
  db-data:
