name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: quant
          POSTGRES_PASSWORD: quant
          POSTGRES_DB: quant_lab
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U quant -d quant_lab"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://quant:quant@localhost:5432/quant_lab_test
      REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v5
      # v7부터 Node 24. v8부터 큰 버전 태그(v10)를 만들지 않아 정확한 버전을 쓴다.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python -m mypy
      - name: migrations match models
        env:
          DATABASE_URL: postgresql+psycopg://quant:quant@localhost:5432/quant_lab
        run: uv run alembic upgrade head && uv run alembic check
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
