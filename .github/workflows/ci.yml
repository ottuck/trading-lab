name: CI

# Actions 분(월 2,000분)을 아끼려고 같은 코드를 두 번 이상 돌리지 않는다 (2026-10-14).
# 작업 PR(→ dev)에서 한 번만 돌고, dev push·dev → main PR·main push에서는 돌지 않는다 (2026-10-14, 사용자 결정).
# main push는 CI 없이 바로 배포한다 (deploy.yml). 문서·인프라만 바뀐 변경은 건너뛴다.
on:
  pull_request:
    branches: [dev]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "infra/**"
      - "LICENSE"
      - ".claude/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 잡마다 분 단위로 올림해 과금되므로 backend와 frontend를 한 잡에 둔다 (frontend는 약 15초라 따로 두면 1분이 된다).
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: quant
          POSTGRES_PASSWORD: quant
          POSTGRES_DB: quant_lab
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U quant -d quant_lab"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://quant:quant@localhost:5432/quant_lab_test
      REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v5
      # v7부터 Node 24. v8부터 큰 버전 태그(v10)를 만들지 않아 정확한 버전을 쓴다.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python -m mypy
      - name: migrations match models
        env:
          DATABASE_URL: postgresql+psycopg://quant:quant@localhost:5432/quant_lab
        run: uv run alembic upgrade head && uv run alembic check
      - run: uv run pytest
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
