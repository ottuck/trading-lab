name: deploy

# main에 push되면 (CI는 작업 PR에서 이미 돌았으므로 다시 돌지 않는다, 2026-10-14) GitHub 호스팅 러너가 이미지를 빌드해 GHCR에 올린다.
# 배포는 서버가 한다 (pull 방식, 2026-11-04): 서버의 update.sh가 1분마다 latest를 받아 보고 바뀌었으면 운영 → 데모 순서로 띄운다
# (deploy/update.sh). GitHub는 서버에서 아무것도 실행하지 않는다 (서버 러너 없음). 결과는 서버가 텔레그램으로 알린다.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "infra/**"
      - "LICENSE"
      - ".claude/**"
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}
  SHA: ${{ github.sha }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SHA }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # 태그는 커밋 해시(롤백용)와 latest. 지금은 linux/amd64만 만든다 (Lightsail).
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:${{ env.SHA }}
            ${{ env.IMAGE }}:latest
          # source: 서버가 이 저장소의 옛 이미지만 지울 때 쓴다 (deploy.sh). revision: update.sh가 커밋 해시 태그로 띄울 때 쓴다.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SHA }}
          build-args: GIT_SHA=${{ env.SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 오래된 이미지를 정리한다. 배포마다 GHCR에 버전이 3개쯤(태그 붙은 목록, 이미지, 출처 증명) 쌓이므로 최근 30개(약 10번 배포, 롤백 가능 범위)만 둔다.
  # 정리가 실패해도 배포 결과는 그대로 둔다.
  cleanup:
    needs: image
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      packages: write
    steps:
      - uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ github.event.repository.name }}
          package-type: container
          min-versions-to-keep: 30
