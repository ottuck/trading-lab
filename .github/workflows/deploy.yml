name: deploy

# main의 CI가 통과하면 운영을 배포한다. 운영 서버(Lightsail 시드니)에 설치한 러너(라벨 quant-lab)가 밖으로만 연결해 받아 간다
# (공개 포트 0개 그대로). 데모는 자동으로 배포하지 않는다: bash deploy/deploy.sh demo
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  prod:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: [self-hosted, quant-lab, Linux]
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # 장 마감 판단(뉴욕 18:00, AI 판단 포함) 중에 Worker를 다시 띄우지 않는다. 그 시간이면 끝날 때까지 기다린다.
      - name: 판단 시간 피하기
        run: |
          while true; do
            hm=$((10#$(TZ=America/New_York date +%H%M)))
            if [ "$hm" -lt 1745 ] || [ "$hm" -ge 1930 ]; then break; fi
            echo "뉴욕 $(TZ=America/New_York date +%H:%M): 판단 시간이라 19:30까지 기다려요"
            sleep 60
          done

      - name: 운영 배포
        env:
          SRC: ${{ github.workspace }}
          SECRETS_DIR: ${{ vars.DEPLOY_SECRETS_DIR }}
        run: |
          [ -n "$SECRETS_DIR" ] || { echo '저장소 변수 DEPLOY_SECRETS_DIR(운영 .secrets 폴더)가 없습니다'; exit 1; }
          bash deploy/deploy.sh

      - name: 확인
        run: |
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8000/api/health && exit 0
            sleep 5
          done
          echo '배포 뒤 api가 응답하지 않습니다'; exit 1
