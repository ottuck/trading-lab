[project]
name = "quant-lab"
version = "0.1.0"
description = "토스증권 시세 기반 퀀트 전략 DRY RUN 도구"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.16",
    "exchange-calendars>=4.13.2",
    "fastapi>=0.118",
    "httpx>=0.28",
    "psycopg[binary]>=3.2",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "sqlalchemy>=2.0.40",
    "tzdata>=2026.4",
    "uvicorn[standard]>=0.37",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=1.18",
    "pandas-stubs>=3.0.5.260914",
    "pytest>=8.4",
    "respx>=0.23.1",
    "ruff>=0.13",
]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "DTZ", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # 한글 주석·문자열의 전각 문자 허용

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "migrations"]

[[tool.mypy.overrides]]
module = ["alembic.*", "exchange_calendars.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff.lint.per-file-ignores]
# 사용자에게 보이는 문장은 줄 길이 제한에서 제외한다
"src/quant_lab/application/messages.py" = ["E501"]
