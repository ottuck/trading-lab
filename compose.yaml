# 로컬 개발용. 운영 구성은 deploy/compose.prod.yaml (Phase 4)에 둔다.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: quant
      POSTGRES_PASSWORD: quant
      POSTGRES_DB: quant_lab
      TZ: UTC
    ports:
      - "${QL_DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quant -d quant_lab"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
