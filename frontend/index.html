<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fbfbfc" />
    <meta
      name="description"
      content="정해 준 규칙과 AI가 사고파는 모습을 모의 투자로 지켜보는 데모예요. 예시 시세로 돌리고, 실제 돈은 오가지 않아요."
    />
    <!-- 링크 미리보기(디스코드·슬랙·카카오톡 등). 크롤러는 로그인 없이 받아야 하므로
         Access가 막은 운영 주소 대신 공개 데모 주소로 고정한다. 해시(#dashboard)는 크롤러에 안 가므로 루트 기준 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Trading Lab" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:title" content="Trading Lab 데모 · 규칙과 AI가 사고파는 모의 투자" />
    <meta
      property="og:description"
      content="정해 준 규칙과 AI가 사고파는 모습을 모의 투자로 지켜보는 데모예요. 예시 시세로 돌리고, 실제 돈은 오가지 않아요."
    />
    <meta property="og:url" content="https://demo.trading-lab.me/" />
    <meta property="og:image" content="https://demo.trading-lab.me/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Trading Lab 데모 대시보드: 나 카피 봇의 모의 투자 결과" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- 홈 화면에 추가하면 주소창 없이 앱처럼 열린다 (PWA) -->
    <!-- Cloudflare Access 뒤에서도 설치되게 로그인 쿠키를 함께 보낸다 (N7) -->
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Trading Lab" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script>
      // 첫 화면부터 테마를 맞춰 깜빡임을 막는다 (자세한 동작은 src/theme.ts).
      try {
        var t = localStorage.getItem('trading-lab:theme')
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
    <title>Trading Lab</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
